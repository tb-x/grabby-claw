<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Grabby Claw</title>
<meta name="theme-color" content="#3b1d6e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Grabby Claw">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap">
<style>
  /* Layout: the 3D claw machine fills the middle of the screen; the joystick and the big grab button sit under it on a phone held upright and either side of it when held sideways. Home top-left, sound and the toy shelf top-right. */
  :root{
    --ink:#2b2233; --cream:#fff8ef; --pink:#ff5fa2; --pink-d:#c02a6e; --red:#ff3b4e; --red-d:#a81628; --gold:#ffd23f; --gold-d:#c98a00;
    --purple:#5b3aa8; --purple-d:#2b1659; --wood:#c98b4f; --wood-d:#9a6232;
    --title:'Luckiest Guy','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
    --read:Verdana,Tahoma,sans-serif;
    --stick:clamp(124px, 36vw, 172px); --btn:clamp(112px, 31vw, 150px);
    --low:calc(max(16px, 3.5vh) + env(safe-area-inset-bottom,0px));
    color-scheme: light;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%;margin:0;overflow:hidden;color:var(--ink);font-family:var(--read);
    background:radial-gradient(ellipse at 50% 28%, #7445c2 0%, #3b1d6e 55%, #1d0d3d 100%);
    touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;padding:0}

  #stage{position:fixed;inset:0;overflow:hidden}
  /* soft arcade lights far behind the machine */
  #stage::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.55;
    background:radial-gradient(circle at 12% 18%, #ff5fa255 0 40px, transparent 90px),radial-gradient(circle at 88% 12%, #4fd6ff44 0 50px, transparent 110px),
      radial-gradient(circle at 80% 62%, #ffd23f33 0 40px, transparent 100px),radial-gradient(circle at 8% 70%, #7bd38933 0 50px, transparent 110px)}
  #c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

  /* ---------- home: back to the list of all games ---------- */
  #home{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));z-index:50;
    width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink);background:rgba(255,255,255,.88);
    box-shadow:0 3px 0 rgba(0,0,0,.18);touch-action:manipulation;-webkit-tap-highlight-color:transparent;text-decoration:none}
  #home svg{width:24px;height:24px}
  #home:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}

  /* ---------- top right: sound, and the shelf of toys won ---------- */
  #mute{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));z-index:50;
    width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.88);font-size:22px;line-height:44px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
  #shelfBtn{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:calc(64px + env(safe-area-inset-right,0px));z-index:50;
    height:48px;min-width:48px;padding:0 12px 0 4px;border-radius:24px;background:var(--cream);display:flex;align-items:center;gap:2px;
    box-shadow:0 3px 0 rgba(0,0,0,.2);font-weight:bold;font-size:20px}
  #shelfBtn img{width:42px;height:42px;display:block}
  #shelfBtn:active{transform:translateY(2px)}
  #shelfBtn.pop{animation:pop .5s}
  @keyframes pop{35%{transform:scale(1.35)}}

  /* ---------- controls: joystick, grab button, coin ---------- */
  #stick{position:fixed;z-index:6;left:calc(6vw + env(safe-area-inset-left,0px));bottom:var(--low);width:var(--stick);height:var(--stick);border-radius:50%;
    background:radial-gradient(circle at 50% 42%, #6d4bc2, #3d2385 72%);box-shadow:0 7px 0 var(--purple-d), inset 0 0 0 5px rgba(255,255,255,.14);touch-action:none}
  #stick .arr{position:absolute;width:20%;height:20%;fill:#fff;opacity:.55}
  #stick .u{left:40%;top:4%} #stick .d{left:40%;bottom:4%;transform:rotate(180deg)} #stick .l{left:4%;top:40%;transform:rotate(-90deg)} #stick .r{right:4%;top:40%;transform:rotate(90deg)}
  #knob{position:absolute;left:50%;top:50%;width:46%;height:46%;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;
    background:radial-gradient(circle at 36% 30%, #ffb0d4, #ff5fa2 45%, #d6307c 80%);box-shadow:0 6px 0 var(--pink-d), 0 8px 10px rgba(0,0,0,.3)}
  #stick.nudge #knob{animation:wiggle 1.2s ease-in-out infinite}
  @keyframes wiggle{0%,100%{transform:translate(-50%,-50%)}25%{transform:translate(-20%,-50%)}75%{transform:translate(-80%,-50%)}}
  #stick.off{opacity:.55}

  .bigbtn{position:fixed;z-index:6;right:calc(6vw + env(safe-area-inset-right,0px));bottom:calc(var(--low) + (var(--stick) - var(--btn)) / 2);width:var(--btn);height:var(--btn);border-radius:50%;display:grid;place-items:center}
  #grab{background:radial-gradient(circle at 40% 32%, #ff8a96, var(--red) 55%, #d8202f 85%);box-shadow:0 10px 0 var(--red-d), 0 12px 16px rgba(0,0,0,.35), inset 0 -6px 0 rgba(0,0,0,.12);
    border:6px solid #ffe3e6;transition:transform .08s, box-shadow .08s}
  #grab svg{width:56%;height:56%}
  #grab:active,#grab.down{transform:translateY(8px);box-shadow:0 2px 0 var(--red-d), 0 3px 6px rgba(0,0,0,.35)}
  #grab.off{filter:saturate(.25) brightness(.85)}
  #grab.call{animation:throb 1s ease-in-out infinite}
  @keyframes throb{50%{transform:scale(1.1)}}
  #coin{background:none}
  #coin svg{width:100%;height:100%;filter:drop-shadow(0 8px 0 rgba(0,0,0,.25));animation:shine 1.6s ease-in-out infinite}
  #coin:active svg{transform:scale(.92)}
  #coin.call svg{animation:hop 0.6s ease-in-out infinite alternate}
  @keyframes shine{50%{transform:rotate(-8deg) scale(1.05)}}
  @keyframes hop{to{transform:translateY(-16px) rotate(8deg)}}
  #flycoin{position:fixed;left:0;top:0;width:64px;height:64px;z-index:30;pointer-events:none;transition:transform .55s cubic-bezier(.4,-0.3,.6,1)}

  /* sideways: joystick and button either side of the machine */
  @media (orientation: landscape){
    :root{--stick:clamp(112px, 34vh, 170px); --btn:clamp(104px, 30vh, 150px); --low:calc(max(14px, 9vh) + env(safe-area-inset-bottom,0px))}
    #stick{left:calc(3vw + env(safe-area-inset-left,0px))}
    .bigbtn{right:calc(3vw + env(safe-area-inset-right,0px))}
  }

  /* ---------- prize: a tap anywhere sends it to the shelf ---------- */
  #tapcatch{position:fixed;inset:0;z-index:15}
  .confetti{position:fixed;top:-20px;width:10px;height:16px;z-index:19;pointer-events:none;border-radius:2px;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

  /* ---------- the shelf of toys won ---------- */
  .veil{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:rgba(20,8,45,.55)}
  .card{position:relative;padding:22px 16px 16px;border-radius:28px;background:var(--cream);box-shadow:0 8px 0 rgba(0,0,0,.25);
    max-width:min(560px, 94vw);max-height:calc(100% - 8px);overflow:auto;animation:rise .4s cubic-bezier(.3,1.5,.6,1)}
  @keyframes rise{from{transform:translateY(40px) scale(.85);opacity:0}}
  #shelves{display:grid;grid-template-columns:repeat(4, 1fr);gap:4px 6px;margin-top:6px}
  @media (orientation: landscape){ #shelves{grid-template-columns:repeat(6, 1fr)} .card{max-width:min(720px, 94vw)} }
  .slot{position:relative;aspect-ratio:1;min-width:64px;border-bottom:10px solid var(--wood);border-radius:0 0 4px 4px;
    background:linear-gradient(#0000 70%, #c98b4f22);display:grid;place-items:end center;box-shadow:0 4px 0 var(--wood-d)}
  .slot img{width:96%;height:96%;object-fit:contain;display:block}
  .slot:not(.got) img{filter:brightness(0) opacity(.13)}
  .slot b{position:absolute;right:2px;top:2px;min-width:26px;height:26px;padding:0 5px;border-radius:13px;background:var(--pink);color:#fff;font-size:15px;line-height:26px}
  .slot.jig img{animation:jig .6s}
  @keyframes jig{25%{transform:rotate(-12deg) scale(1.1)}75%{transform:rotate(12deg) scale(1.1)}}
  #shelfTop{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--title);font-size:30px;color:var(--pink);min-height:44px;padding:0 44px}
  #shelfClose{position:absolute;right:10px;top:10px;width:48px;height:48px;border-radius:50%;background:var(--pink);color:#fff;box-shadow:0 4px 0 var(--pink-d);display:grid;place-items:center}
  #shelfClose svg{width:24px;height:24px}

  @media (prefers-reduced-motion: reduce){ .card,#coin svg,#grab.call,#stick.nudge #knob{animation:none} }
</style>
</head>
<body>
<a id="home" href="../index.html" aria-label="All games" title="All games"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 9.8V20h12V9.8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/><path d="M10 20v-5.5h4V20" fill="currentColor"/></svg></a>
<button id="mute" aria-label="Sound on or off">🔈</button>
<button id="shelfBtn" aria-label="My toys"><img id="shelfImg" alt=""><span id="shelfCount">0</span></button>
<div id="stage"><canvas id="c"></canvas></div>

<div id="stick" aria-label="Move the claw" class="off">
  <svg class="arr u" viewBox="0 0 10 10"><path d="M5 1 9.5 8h-9z"/></svg><svg class="arr d" viewBox="0 0 10 10"><path d="M5 1 9.5 8h-9z"/></svg>
  <svg class="arr l" viewBox="0 0 10 10"><path d="M5 1 9.5 8h-9z"/></svg><svg class="arr r" viewBox="0 0 10 10"><path d="M5 1 9.5 8h-9z"/></svg>
  <div id="knob"></div>
</div>
<button id="grab" class="bigbtn off" aria-label="Grab!" hidden><svg viewBox="0 0 48 48" aria-hidden="true">
  <path d="M24 3v12" stroke="#fff" stroke-width="4" stroke-linecap="round"/><rect x="17" y="13" width="14" height="8" rx="3" fill="#fff"/>
  <path d="M19 21 11 31l6 11M29 21l8 10-6 11M24 21v20" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
<button id="coin" class="bigbtn" aria-label="Put in a coin"><svg viewBox="0 0 64 64" aria-hidden="true">
  <circle cx="32" cy="32" r="29" fill="#e9a400"/><circle cx="32" cy="30" r="27" fill="#ffd23f"/><circle cx="32" cy="30" r="20" fill="none" stroke="#f0b400" stroke-width="3"/>
  <path d="m32 15 4.3 9 9.7 1.2-7.1 6.7 1.8 9.7L32 37l-8.7 4.6 1.8-9.7-7.1-6.7 9.7-1.2z" fill="#fff6c7" stroke="#e9a400" stroke-width="2" stroke-linejoin="round"/>
  <path d="M15 21a20 20 0 0 1 9-8" stroke="#fff" stroke-width="3.5" stroke-linecap="round" opacity=".7"/></svg></button>
<svg id="flycoin" viewBox="0 0 64 64" hidden aria-hidden="true"><circle cx="32" cy="32" r="29" fill="#e9a400"/><circle cx="32" cy="30" r="27" fill="#ffd23f"/>
  <path d="m32 15 4.3 9 9.7 1.2-7.1 6.7 1.8 9.7L32 37l-8.7 4.6 1.8-9.7-7.1-6.7 9.7-1.2z" fill="#fff6c7" stroke="#e9a400" stroke-width="2" stroke-linejoin="round"/></svg>
<div id="tapcatch" hidden></div>

<div id="shelf" class="veil" hidden>
  <div class="card">
    <button id="shelfClose" aria-label="Back to the claw machine"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5 5 19" stroke="currentColor" stroke-width="3.6" stroke-linecap="round"/></svg></button>
    <div id="shelfTop"></div>
    <div id="shelves"></div>
  </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

/* ======== tuning knobs ======== */
const MOVE_SPEED = 1.9;     // how fast the claw slides along the top (the box is 4.2 wide)
const DROP_SPEED = 2.4;     // how fast it goes down,
const LIFT_SPEED = 1.6;     // back up,
const CARRY_SPEED = 1.7;    // and over to the prize hole
const HOLD_CENTRE = 0.9;    // chance a toy right under the middle of the claw stays held all the way to the hole
const HOLD_EDGE = 0.35;     // ... and one only just caught by its edge
const GRAB_REACH = 1.0;     // how far off-centre still catches a toy, in toy sizes (its radius)
const BURIED = 0.6;         // the hold chance is multiplied by this for each toy lying on top of the caught one
const LUCKY_AFTER = 2;      // after this many tries in a row with no prize, the next toy caught is held for sure
const TOYS_IN = 18;         // toys in a full machine
const REFILL_AT = 11;       // with fewer than this left, a fresh load drops in
const NEW_TOY_PULL = 3;     // a kind of toy not on the shelf yet is this many times likelier to go into the machine
const GRAVITY = 14;         // plush falls a bit floaty
const HELP_TIMES = 3;       // the spoken how-to lines are said this many times ever, then the child knows
const IDLE_HINT = 6;        // seconds of nothing before the joystick or button nudges
const PRIZE_SHOW = 3.4;     // seconds a prize is shown before it hops onto the shelf by itself
const MUSIC_VOL = 0.05;
const MUSIC_BPM = 112;

/* ======== the machine's measurements (world units, a toy is about 0.85 across) ======== */
const BX = 2.1, BZ = 1.5, BTOP = 4.75;      // inside of the glass box: x -2.1..2.1, z -1.5..1.5, floor at y 0
const HOLE = { x0: -BX, x1: -1.0, z0: 0.35, z1: BZ, wall: 0.7 };   // prize hole in the front-left corner, inside a low clear wall
const HOLE_X = (HOLE.x0 + HOLE.x1) / 2, HOLE_Z = (HOLE.z0 + HOLE.z1) / 2;
const RAIL_Y = 4.5;         // the carriage runs on rails up here
const TOP_Y = 3.7;          // hub height with the claw up
const GRIP = 0.62;          // a held toy's centre hangs this far below the hub
const FLOOR_STOP = 0.76;    // lowest the hub goes (open claw tips just above the floor)
const LIM_X = 1.72, LIM_Z = 1.12;   // how far the claw can go
const OPEN_ANGLE = 0.65, SHUT_ANGLE = -0.16;
const DOOR = new THREE.Vector3(HOLE_X, -0.85, 1.8), SLOT = new THREE.Vector3(1.45, -0.62, 1.8);

/* ======== little helpers ======== */
const $ = (s) => document.querySelector(s);
const store = {
  get(k, d) { try { const v = localStorage.getItem('clawmachine.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('clawmachine.' + k, JSON.stringify(v)); } catch {} },
};
const params = new URLSearchParams(location.search);
const FORCE_MUTE = params.has('mute') || params.has('tbxtest');   // test runs stay silent
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = (t) => t * t * (3 - 2 * t);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const buzz = (ms) => { try { if (navigator.userActivation?.hasBeenActive !== false) navigator.vibrate?.(ms); } catch {} };
const event = (name, data) => { try { window.tbxEvent?.(name, data); } catch {} };

/* ======== sound: all synthesized, and the device's own voice ======== */
const MUSIC_BARS = [
  { bass: 48, arp: [60, 64, 67, 72] }, { bass: 45, arp: [57, 60, 64, 69] },
  { bass: 41, arp: [57, 60, 65, 69] }, { bass: 43, arp: [55, 59, 62, 67] },
];
const MUSIC_TUNE = [72, 74, 76, 79, 81];
const midiHz = (m) => 440 * 2 ** ((m - 69) / 12);
const sfx = (() => {
  let ac = null, out = null, noise = null, motorO = null, motorG = null, mus = null, muted = FORCE_MUTE || store.get('muted', false);
  const music = { on: false, want: false, timer: 0, step: 0, next: 0, tune: [] };
  function init() {
    if (ac) { if (ac.state !== 'running') ac.resume().catch(() => {}); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ac = new AC(); out = ac.createGain(); out.gain.value = muted ? 0 : 0.8; out.connect(ac.destination);
    noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    // the gantry motor: one hum that's turned up while something moves
    motorO = ac.createOscillator(); motorO.type = 'sawtooth'; motorO.frequency.value = 70;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420;
    motorG = ac.createGain(); motorG.gain.value = 0; motorO.connect(lp).connect(motorG).connect(out); motorO.start();
    mus = ac.createGain(); mus.gain.value = MUSIC_VOL; mus.connect(out);
    try { speechSynthesis.speak(new SpeechSynthesisUtterance('')); } catch {}   // iOS lets the voice speak later only if it spoke in a tap
    if (music.want) startMusic();
  }
  const ok = () => ac && ac.state === 'running';   // muted sounds still play, into a silent output
  function tone(type, f0, f1, at, dur, vol, cut, dest = out) {
    const t = ac.currentTime + at, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.setValueAtTime(vol, t + dur * 0.5);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let node = o.connect(g);
    if (cut) { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cut; g.connect(f); node = f; }
    node.connect(dest); o.start(t); o.stop(t + dur + 0.05);
  }
  function hiss(at, dur, vol, cut) {
    const t = ac.currentTime + at, s = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
    s.buffer = noise; f.type = 'lowpass'; f.frequency.value = cut;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f).connect(g).connect(out); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
  }
  // a bouncy arcade loop: kick, tick, bass, arpeggio and a little random tune each bar
  function startMusic() {
    music.want = true;
    if (!ok() || music.on || muted) return;
    music.on = true; music.step = 0; music.next = ac.currentTime + 0.1;
    music.timer = setInterval(() => {
      if (music.next < ac.currentTime - 0.05) music.next = ac.currentTime + 0.05;   // timer held up: skip, don't burst
      while (music.next < ac.currentTime + 0.15) { note(music.step, music.next); music.next += 60 / MUSIC_BPM / 4; music.step++; }
    }, 25);
  }
  function stopMusic() { music.on = false; clearInterval(music.timer); }
  function note(i, t) {
    const s = i % 16, bar = MUSIC_BARS[Math.floor(i / 16) % MUSIC_BARS.length], at = t - ac.currentTime;
    if (s === 0) music.tune = Array.from({ length: 8 }, () => (Math.random() < 0.35 ? pick(MUSIC_TUNE) : 0));
    if (s === 0 || s === 8) tone('sine', 130, 45, at, 0.16, 0.5, 0, mus);
    if (s === 4 || s === 12) tone('triangle', 2600, 2600, at, 0.03, 0.05, 0, mus);
    if (s % 4 === 0 || s === 6 || s === 14) tone('square', midiHz(bar.bass), midiHz(bar.bass), at, 0.14, 0.14, 700, mus);
    if (s % 2 === 0) tone('triangle', midiHz(bar.arp[(s / 2) % 4] + (s >= 8 ? 12 : 0)), midiHz(bar.arp[(s / 2) % 4] + (s >= 8 ? 12 : 0)), at, 0.1, 0.07, 0, mus);
    if (s % 2 === 0 && music.tune[s / 2]) tone('sine', midiHz(music.tune[s / 2]), midiHz(music.tune[s / 2]), at, 0.26, 0.09, 0, mus);
  }
  function duck(secs) {
    if (!mus) return; const t = ac.currentTime, g = mus.gain;
    g.cancelScheduledValues(t); g.setTargetAtTime(MUSIC_VOL * 0.3, t, 0.08); g.setTargetAtTime(MUSIC_VOL, t + secs, 0.4);
  }
  return {
    init,
    get muted() { return muted; },
    toggle() {
      muted = !muted; if (!FORCE_MUTE) store.set('muted', muted);
      if (out) out.gain.value = muted ? 0 : 0.8;
      if (muted) { try { speechSynthesis.cancel(); } catch {} stopMusic(); } else if (music.want) startMusic();
      return muted;
    },
    music(on) { if (on) startMusic(); else { music.want = false; stopMusic(); } },
    pause() { stopMusic(); }, resume() { if (music.want) startMusic(); },
    motor(level, pitch) {
      if (!motorG) return; const t = ac.currentTime;
      motorG.gain.setTargetAtTime(level * 0.06, t, 0.05); motorO.frequency.setTargetAtTime(pitch, t, 0.08);
    },
    tap() { if (ok()) tone('sine', 660, 760, 0, 0.06, 0.06); },
    coin() {
      if (!ok()) return;
      tone('square', 1976, 1976, 0, 0.07, 0.04, 5000); tone('sine', 2637, 2637, 0.07, 0.4, 0.08);

const muteBtn = $('#mute');
const drawMute = () => { muteBtn.textContent = sfx.muted ? '🔇' : '🔈'; };
drawMute();
muteBtn.addEventListener('click', () => { sfx.init(); sfx.toggle(); drawMute(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { sfx.pause(); sfx.motor(0, 60); } else sfx.resume(); });

/* ======== layout: fit the machine into the space the controls leave ======== */
let W = 1, H = 1;
const PITCH = 0.3, LOOK = new THREE.Vector3(0, 1.9, 0), _v = new THREE.Vector3();
function placeCamera(d) {
  camera.position.set(0, LOOK.y + Math.sin(PITCH) * d, Math.cos(PITCH) * d); camera.lookAt(LOOK);
  camera.updateMatrixWorld(); camera.updateProjectionMatrix();
}
function fits(pts, a) {
  for (const p of pts) {
    _v.copy(p).project(camera);
    const sx = (_v.x + 1) / 2 * W, sy = (1 - _v.y) / 2 * H;
    if (sx < a.x0 || sx > a.x1 || sy < a.y0 || sy > a.y1) return false;
  }
  return true;
}
function layout() {
  W = innerWidth; H = innerHeight;
  renderer.setSize(W, H, false);
  const land = W > H * 1.05, st = stick.getBoundingClientRect(), hb = $('#home').getBoundingClientRect();
  const btnRight = W - parseFloat(getComputedStyle(grabBtn).right) - grabBtn.offsetWidth;   // (the button may be hidden)
  const a = land ? { x0: st.right + 8, x1: btnRight - 8, y0: 8, y1: H - 8 } : { x0: 8, x1: W - 8, y0: hb.bottom + 6, y1: st.top - 10 };
  camera.aspect = W / H;
  camera.setViewOffset(W, H, W / 2 - (a.x0 + a.x1) / 2, H / 2 - (a.y0 + a.y1) / 2, W, H);
  // the glass box, the sign (when there's room) and the prize door must all show
  // (sideways there's less height, so the sign and the bottom of the prize door may be cut off)
  const top = land ? BTOP + 0.3 : BTOP + 1.45, bottom = land ? -0.85 : -1.4;
  const pts = [];
  for (const x of [-2.5, 2.5]) for (const [y, z] of [[bottom, 1.85], [top, 1.7], [top, -1.75]]) pts.push(new THREE.Vector3(x, y, z));
  let lo = 3, hi = 80;
  for (let i = 0; i < 26; i++) { const d = (lo + hi) / 2; placeCamera(d); if (fits(pts, a)) hi = d; else lo = d; }
  placeCamera(hi);
  ov.cam.aspect = W / H; ov.cam.updateProjectionMatrix();
}
function toScreen(p) { _v.copy(p).project(camera); return { x: (_v.x + 1) / 2 * W, y: (1 - _v.y) / 2 * H }; }
addEventListener('resize', layout);
screen.orientation?.addEventListener?.('change', () => setTimeout(layout, 100));

/* ======== each frame ======== */
const _q = new THREE.Quaternion(), _ax = new THREE.Vector3();
function updateVisuals(dt, time) {
  // gantry, cable and claw
  carriage.position.set(claw.x, RAIL_Y - 0.06, claw.z); crossbar.position.z = claw.z;
  const top = carriage.position.clone().setY(RAIL_Y - 0.14), dir = hubPos.clone().add(new THREE.Vector3(0, 0.12, 0)).sub(top), len = dir.length();
  cable.position.copy(top).addScaledVector(dir, 0.5); cable.scale.y = len; cable.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  clawG.position.copy(hubPos); clawG.rotation.set(claw.sz * 0.9, 0, -claw.sx * 0.9);
  const shut = claw.grip ? (claw.grip.toy.r - 0.42) * 1.2 : SHUT_ANGLE;
  const ang = lerp(shut, OPEN_ANGLE, ease(claw.open)) + claw.flick * 0.35 + (claw.state === 'aim' ? Math.sin(time * 3) * 0.02 : 0);
  for (const p of prongs) p.rotation.z = ang;
  // aiming ring and beam
  const aiming = game.mode === 'play' && ['aim', 'open', 'down'].includes(claw.state);
  ring.visible = beam.visible = aiming;
  claw.cand = claw.state === 'aim' ? candidateAt(claw.x, claw.z) : null;
  if (aiming) {
    const sy = surfaceAt(hubPos.x, hubPos.z) + 0.02, bottom = claw.y - (claw.open > 0.5 ? 0.72 : 0.95);
    ring.position.set(hubPos.x, sy, hubPos.z); ring.scale.setScalar(1 + Math.sin(time * 6) * 0.08);
    ring.material.color.set(claw.cand ? '#7dff8a' : '#fff35c');
    const bl = Math.max(0.01, bottom - sy); beam.position.set(hubPos.x, sy + bl / 2, hubPos.z); beam.scale.y = bl; beam.visible = aiming && bl > 0.05;
  }
  // toys: follow their balls; tumble while flying, settle back upright when they land
  let thud = 0;
  for (const t of toys) {
    if (t.landed) { thud = Math.max(thud, t.landed); t.landed = 0; }
    t.bob = lerp(t.bob, t === claw.cand ? 1 : 0, Math.min(1, dt * 8));
    t.mesh.position.copy(t.p); t.mesh.position.y += t.bob * Math.abs(Math.sin(time * 5)) * 0.05;
    t.mesh.scale.setScalar(t.r * (1 + t.bob * 0.05));
    if (t.held) { t.rest.setFromEuler(_eu.set(0.1, Math.sin(time * 1.5) * 0.25, 0)); t.mesh.quaternion.slerp(t.rest, Math.min(1, dt * 5)); continue; }
    const airborne = !t.asleep && !t.ground && t.spin.lengthSq() > 0.05;
    if (airborne) {
      const w = t.spin.length(); _ax.copy(t.spin).divideScalar(w); _q.setFromAxisAngle(_ax, w * dt); t.mesh.quaternion.premultiply(_q);
    }
    t.spin.multiplyScalar(Math.exp(-dt * (t.ground ? 6 : 0.6)));
    if (!airborne) t.mesh.quaternion.slerp(t.rest, Math.min(1, dt * 4));
  }
  if (thud > 0) sfx.pomf(clamp(thud / 6, 0.3, 1));
  // the prize door flap swings open as a prize drops through
  game.flapOpen = Math.max(0, game.flapOpen - dt);
  flap.rotation.x = lerp(flap.rotation.x, game.flapOpen > 0 ? -1.0 : 0, Math.min(1, dt * 8));
  // marquee lights: a chase, a quick flash after a coin, a party while a prize shows
  game.flash = Math.max(0, game.flash - dt);
  const party = game.mode === 'prize', step = Math.floor(time * (party ? 14 : 5));
  for (let i = 0; i < bulbSpots.length; i++) {
    const on = party || game.flash > 0 ? (step + (i % 2)) % 2 === 0 : (i + step) % 3 !== 0;
    bulbs.setColorAt(i, on ? BULB_COLOURS[(i + (party ? step : 0)) % 3] : BULB_OFF);
  }
  bulbs.instanceColor.needsUpdate = true;
  slotGlow.material.color.set(claw.state === 'coin' && Math.sin(time * 6) > 0 ? '#fff6a8' : '#ffc400');
}
function updateRefill(dt) {
  if (!refill.queue) return;
  refill.t -= dt;
  if (refill.t > 0) return;
  const [x, z] = freeSpot(); addToy(chooseKind(), x, 4.1, z); refill.queue--; refill.t = 0.22; sfx.plop();
}
function updateHints(dt) {
  if (game.mode !== 'play' || !shelfEl.hidden) return;
  game.idle += dt;
  if (claw.state === 'coin' && game.idle > IDLE_HINT && !coinBtn.classList.contains('call')) { coinBtn.classList.add('call'); help('coin', 'Tap the coin!'); }
  if (claw.state === 'aim' && game.idle > IDLE_HINT) {
    if (!game.moved) stick.classList.add('nudge');
    else if (!grabBtn.classList.contains('call')) { grabBtn.classList.add('call'); help('press', 'Press the red button!'); }
  }
}
let last = performance.now(), clock = 0;
function step(dt) {
  clock += dt;
  updateClaw(dt); physics(dt); updateRefill(dt); updateShow(dt); updateHints(dt); updateVisuals(dt, clock);
}
function render() {
  renderer.render(scene, camera);
  if (ov.phase) { renderer.autoClear = false; renderer.clearDepth(); renderer.render(ov.scene, ov.cam); renderer.autoClear = true; }
}
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  step(dt); render();
}

/* ======== start ======== */
layout();
fillMachine();
renderThumbs();
drawShelfBtn(false);
showButtons();
requestAnimationFrame(frame);

// test hooks (the Browser pane barely draws frames in a hidden tab, so tick() runs the game by hand)
window.__claw = {
  get claw() { return claw; }, get toys() { return toys; }, get game() { return game; }, get got() { return got; },
  get audio() { return { running: sfx.running, muted: sfx.muted, music: sfx.playing }; },
  get draws() { return renderer.info.render; },
  coin() { coinTap(); }, grab() { pressGrab(); }, done() { showDone(); },
  moveTo(x, z) { claw.target = { x, z }; },
  over(i = 0) { const t = toys[i]; claw.x = t.p.x; claw.z = t.p.z; claw.target = null; return t.kind; },
  screenOf(i) { return toScreen(toys[i].p); },
  tick(seconds, draw = true) { for (let i = 0; i < seconds * 60; i++) step(1 / 60); if (draw) render(); },
  reset() { got = {}; store.set('got', got); store.set('heard', {}); drawShelfBtn(false); },
};
</script>
<script>
// Offline support: sw.js caches this page. Once the page has loaded, send it every file the page used (fonts,
// three.js) so those work offline too. Fails quietly where unsupported, e.g. on file://.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then((reg) => {
    const send = () => reg.active && reg.active.postMessage({ cache: [location.href, ...performance.getEntriesByType('resource').map((r) => r.name)] });
    send(); setTimeout(send, 5000); setTimeout(send, 20000);
  }).catch(() => {});
  // When sw.js says a newer version of this page has just been downloaded, reload once to show it: straight away if
  // nobody has tapped or pressed a key yet, otherwise when the page comes back after 5+ minutes away, so a game in
  // progress is never lost. A timestamp in sessionStorage stops a second reload within 30 s.
  let started = false, newer = false, hiddenAt = 0;
  addEventListener('pointerdown', () => { started = true; }, true);
  addEventListener('keydown', () => { started = true; }, true);
  const reload = () => {
    const key = 'tbx-sw-reload:' + location.pathname;
    try { if (Date.now() - (+sessionStorage.getItem(key) || 0) < 30000) return; sessionStorage.setItem(key, Date.now()); } catch { return; }
    location.reload();
  };
  navigator.serviceWorker.addEventListener('message', (e) => { if (e.data && e.data.updated) { newer = true; if (!started) reload(); } });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) hiddenAt = Date.now();
    else if (newer && hiddenAt && Date.now() - hiddenAt >= 5 * 60 * 1000) reload();
  });
}
</script>
